name: Importar histórico (backfill)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Quantos dias para trás importar"
        default: "180"
      sleep:
        description: "Segundos de pausa entre páginas (seja educado com o site)"
        default: "2"

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Importar horas que ainda não estão no histórico
        run: python radar.py backfill --days ${{ inputs.days }} --sleep ${{ inputs.sleep }}

      - name: Salvar histórico no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/snapshots
          git diff --cached --quiet && exit 0
          git commit -m "backfill ${{ inputs.days }} dias"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
