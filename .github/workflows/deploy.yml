name: Publicar página

# Chamado pelos outros robôs no fim de cada execução, e também pode ser rodado à mão.
# Todas as publicações passam por esta fila única ("pages"), para não brigarem entre si.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # pega o commit que o robô acabou de enviar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python radar.py build-db && python radar.py export --out web/data/index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # o GitHub às vezes falha ao ler o pacote recém-enviado ("Fetching artifact metadata failed"):
      # espera e tenta de novo
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
