name: Coleta horária

on:
  schedule:
    - cron: "7 * * * *"        # pedido a cada hora (o GitHub pode atrasar; a coleta recupera as horas perdidas)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      RADAR_SOURCE: ${{ vars.RADAR_SOURCE || 'getdaytrends' }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Coletar tendências da hora
        run: python radar.py collect

      - name: Manchetes dos jornais
        run: python context.py news
        continue-on-error: true

      - name: Explicar o top 10 (notícias, tweets e IA)
        run: python context.py explain --top 10
        continue-on-error: true

      - name: Pauta da imprensa
        run: python context.py analyze-news
        continue-on-error: true

      - name: Filtro de clientes (Outback, Huggies, Heinz, Yoki, Sonho de Valsa)
        run: python clients.py
        continue-on-error: true

      - name: Salvar no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/snapshots data/news data/clients web/context web/news web/clients 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "coleta $(date -u +%Y-%m-%dT%H:00Z)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
